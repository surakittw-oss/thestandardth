<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>THE STANDARD — บทความ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Serif+Thai:wght@400;500;600;700;900&family=IBM+Plex+Serif:ital,wght@0,400;0,600;0,700;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=32" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js?v=18"></script>
<script type="text/babel" src="components.jsx?v=27"></script>

<script type="text/babel">
function App() {
  const [dark, setDark] = React.useState(false);
  const [activeCat, setActiveCat] = React.useState('ALL');

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  // Pick which article to show. Supports ?id=<article-id>; falls back to first.
  const params = new URLSearchParams(window.location.search);
  const wantId = params.get('id');
  const article = (wantId && window.ARTICLES.find(a => a.id === wantId)) || window.ARTICLES[0];

  const related = window.ARTICLES
    .filter(a => a.category === article.category && a.id !== article.id)
    .slice(0, 4);

  return (
    <ArticlePage
      article={article}
      dark={dark}
      setDark={setDark}
      activeCat={activeCat}
      setActiveCat={setActiveCat}
      related={related.length ? related : window.ARTICLES.slice(1, 5)}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

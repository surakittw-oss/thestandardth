<style>
/* ============================================================
   Breaking News Live — สไตล์เฉพาะหน้า demo นี้
   แยกไว้ในไฟล์ตัวเองทั้งหมด ไม่แตะ styles.css ของเว็บเดิม
   สีและฟอนต์ดึงจาก token ของเว็บ (--brand, --sans, --ink …)
   จึงเปลี่ยนตาม light/dark ของเว็บอัตโนมัติ
   ============================================================ */

.bnl-wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter); }

/* ---------- แถบข่าวด่วน ---------- */
.bnl-ticker {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  margin: 0 0 22px; padding: 13px 18px;
  background: var(--brand); color: #fff;
  border-radius: 6px; overflow: hidden;
  font-family: var(--sans); font-size: 15px; line-height: 1.4;
  box-shadow: 0 3px 14px rgba(230, 51, 42, .28);
}
.bnl-ticker::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
  background: linear-gradient(100deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.22) 50%, rgba(255,255,255,0) 65%);
  transform: translateX(-100%);
  animation: bnl-sheen 5s ease-in-out 1s infinite;
}
@keyframes bnl-sheen { 0% { transform: translateX(-100%); } 55%, 100% { transform: translateX(100%); } }

.bnl-badge {
  flex-shrink: 0; background: #fff; color: var(--brand);
  font-size: 11px; font-weight: 700; letter-spacing: .6px;
  padding: 3px 10px; border-radius: 3px; white-space: nowrap;
}
.bnl-badge--alert { animation: bnl-blink 1.1s ease-in-out infinite; }
@keyframes bnl-blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

.bnl-ticker__link { flex: 1; min-width: 0; color: #fff; text-decoration: none; overflow: hidden; white-space: nowrap; }
.bnl-ticker__link:hover { text-decoration: underline; }
.bnl-track { display: inline-flex; align-items: center; white-space: nowrap; }
.bnl-text { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
.bnl-clone { display: none; }
.bnl-marquee .bnl-track { gap: 64px; animation: bnl-marquee var(--bnl-dur, 20s) linear infinite; }
.bnl-marquee .bnl-text { max-width: none; overflow: visible; text-overflow: clip; }
.bnl-marquee .bnl-clone { display: inline-block; }
@keyframes bnl-marquee { from { transform: translateX(0); } to { transform: translateX(calc(-1 * var(--bnl-shift, 0px))); } }
.bnl-ticker:hover .bnl-track { animation-play-state: paused; }

.bnl-photo {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; background: rgba(255,255,255,.18);
  border: 1px solid rgba(255,255,255,.5); border-radius: 3px;
  color: #fff; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer;
}
.bnl-photo:hover { background: rgba(255,255,255,.32); }
.bnl-close { flex-shrink: 0; background: none; border: 0; padding: 0 4px; font-size: 20px; line-height: 1; color: rgba(255,255,255,.75); cursor: pointer; }
.bnl-close:hover { color: #fff; }
.bnl-fading .bnl-badge, .bnl-fading .bnl-ticker__link { opacity: 0; }
.bnl-badge, .bnl-ticker__link { transition: opacity .25s ease; }
.bnl-fading .bnl-badge { animation: none; }

/* ---------- กล่องอัปเดตล่าสุด 2 ช่อง ---------- */
.bnl-box {
  display: flex; flex-wrap: wrap;
  border: 1px solid var(--rule); border-radius: 10px;
  background: var(--bg); overflow: hidden; margin: 0 0 34px;
  font-family: var(--sans);
}
.bnl-feature { position: relative; flex: 1 1 300px; min-width: 0; border-bottom: 1px solid var(--rule); }
.bnl-feature__media { position: relative; overflow: hidden; }
.bnl-feature__img { display: block; width: 100%; height: auto; }
.bnl-live-tag {
  position: absolute; top: 10px; left: 10px;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 3px;
  background: var(--brand); color: #fff;
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
}
.bnl-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: bnl-pulse 1.6s ease-in-out infinite; }
@keyframes bnl-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.8); } }
.bnl-feature__body { padding: 14px 16px 16px; }
.bnl-updated { display: block; margin: 0 0 5px; font-size: 11px; font-weight: 700; letter-spacing: .3px; color: var(--ink-3); }
.bnl-feature__title { margin: 0 0 6px; font-size: 17px; font-weight: 700; line-height: 1.4; color: var(--ink); font-family: var(--serif); }
.bnl-feature__excerpt { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-2); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 1; overflow: hidden; }

.bnl-updates { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; }
.bnl-updates__head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 11px 16px; border-bottom: 1px solid var(--rule); }
.bnl-updates__title { font-size: 13px; font-weight: 700; color: var(--ink); }
.bnl-auto { font-size: 10px; color: var(--ink-4); }
.bnl-list { display: flex; flex-direction: column; max-height: 330px; overflow-y: auto; }
.bnl-row { position: relative; display: flex; gap: 9px; padding: 11px 16px; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
.bnl-row:last-child { border-bottom: none; }
.bnl-row:hover .bnl-row__text { text-decoration: underline; }
.bnl-row__dot { flex: 0 0 auto; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--rule); }
.bnl-row--latest .bnl-row__dot { background: var(--brand); animation: bnl-pulse 1.6s ease-in-out infinite; }
.bnl-row__main { min-width: 0; flex: 1 1 auto; }
.bnl-row__meta { display: flex; align-items: center; gap: 6px; margin: 0 0 3px; }
.bnl-row__time { font-size: 11px; font-weight: 700; color: var(--ink-4); white-space: nowrap; }
.bnl-chip { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.bnl-row__text { display: block; font-size: 13px; line-height: 1.5; color: var(--ink-2); overflow-wrap: break-word; }
.bnl-row--new { animation: bnl-slidein .45s ease; }
@keyframes bnl-slidein { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

/* ---------- หน้าข่าวสด ---------- */
.bnl-livebar { display: flex; align-items: center; gap: 10px; padding: 11px 18px; background: var(--brand); color: #fff; border-radius: 8px 8px 0 0; font-family: var(--sans); }
.bnl-livebar__text { flex: 1; min-width: 0; font-size: 14px; opacity: .95; }
.bnl-livebar__live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .6px; }
.bnl-highlights { background: var(--bg-tint); border: 1px solid var(--rule); border-top: none; border-radius: 0 0 8px 8px; padding: 18px; margin: 0 0 26px; font-family: var(--sans); }
.bnl-highlights__title { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: var(--ink-3); margin: 0 0 10px; }
.bnl-highlights ul { list-style: none; margin: 0; padding: 0; }
.bnl-highlights li { position: relative; padding-left: 20px; margin-bottom: 8px; font-size: 15px; line-height: 1.7; color: var(--ink-2); }
.bnl-highlights li:last-child { margin-bottom: 0; }
.bnl-highlights li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }

.bnl-count { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 14px; font-family: var(--sans); }
.bnl-count strong { font-size: 15px; color: var(--ink); }
.bnl-count span { font-size: 12px; color: var(--ink-4); }

.bnl-feed { position: relative; padding-left: 26px; font-family: var(--sans); }
.bnl-feed::before { content: ""; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--rule); }
.bnl-item { position: relative; margin: 0 0 20px; }
.bnl-item::before { content: ""; position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); border: 2px solid var(--rule); }
.bnl-item--first::before { border-color: var(--brand); background: var(--brand); }
.bnl-item__time { display: flex; align-items: baseline; gap: 8px; margin: 0 0 7px; }
.bnl-item__rel { font-size: 13px; font-weight: 700; color: var(--brand); }
.bnl-item__abs { font-size: 12px; color: var(--ink-4); }
.bnl-card { border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; background: var(--bg); }
.bnl-card__title { margin: 8px 0 6px; font-size: 17px; font-weight: 700; line-height: 1.45; color: var(--ink); font-family: var(--serif); }
.bnl-card__body { font-size: 15px; line-height: 1.75; color: var(--ink-2); }
.bnl-card__body p { margin: 0 0 .85em; }
.bnl-card__body p:last-child { margin-bottom: 0; }
.bnl-card__img { display: block; width: 100%; height: auto; border-radius: 8px; margin: 0 0 10px; }
.bnl-card__foot { display: flex; justify-content: flex-start; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule); }
.bnl-share { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font: inherit; font-size: 12px; color: var(--ink-4); cursor: pointer; }
.bnl-share:hover { color: var(--brand); }

/* ---------- popup ดูรูป ---------- */
.bnl-lightbox { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; padding: 48px 24px 24px; background: rgba(0,0,0,.9); }
.bnl-lightbox.is-open { display: flex; }
.bnl-lightbox__img { max-width: 100%; max-height: 76vh; display: block; margin: 0 auto; border-radius: 4px; }
.bnl-lightbox__cap { margin: 14px auto 0; max-width: 760px; color: #f0f0f0; font-size: 14px; line-height: 1.65; text-align: center; font-family: var(--sans); }
.bnl-lightbox__close { position: absolute; top: 12px; right: 18px; background: none; border: 0; color: rgba(255,255,255,.85); font-size: 32px; line-height: 1; cursor: pointer; }

/* ---------- แผงควบคุม demo ---------- */
.bnl-demo {
  position: sticky; top: 0; z-index: 50;
  /* สีคงที่ ไม่ใช้ var(--ink) เพราะใน dark mode token นั้นกลับเป็นสีสว่าง
     ทำให้พื้นสว่างชนกับตัวหนังสือขาวจนอ่านไม่ออก */
  background: #141414; color: #fff;
  border-bottom: 1px solid rgba(255, 255, 255, .14);
  font-family: var(--sans); font-size: 13px;
}
.bnl-demo__in { max-width: var(--maxw); margin: 0 auto; padding: 10px var(--gutter); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bnl-demo__tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; background: var(--brand); padding: 3px 8px; border-radius: 3px; }
.bnl-demo__hint { color: rgba(255,255,255,.6); margin-right: auto; font-size: 12px; }
.bnl-btn { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.28); color: #fff; font: inherit; font-size: 12px; padding: 5px 11px; border-radius: 5px; cursor: pointer; }
.bnl-btn:hover { background: rgba(255,255,255,.22); }
.bnl-btn--on { background: var(--brand); border-color: var(--brand); }

.bnl-section-label { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-4); margin: 40px 0 12px; }
.bnl-note { border-left: 3px solid var(--brand); background: var(--bg-tint); padding: 12px 16px; margin: 0 0 26px; font-family: var(--sans); font-size: 13px; line-height: 1.7; color: var(--ink-2); border-radius: 0 6px 6px 0; }

@media (max-width: 700px) {
  .bnl-ticker { font-size: 14px; padding: 11px 14px; }
  .bnl-feature__title { font-size: 16px; }
  .bnl-highlights li, .bnl-card__body { font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .bnl-ticker::after, .bnl-badge--alert, .bnl-dot, .bnl-row--latest .bnl-row__dot, .bnl-marquee .bnl-track, .bnl-row--new { animation: none !important; }
  .bnl-marquee .bnl-text { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .bnl-marquee .bnl-clone { display: none; }
}
</style>
</head>

<script type="text/babel">
/* ============================================================
   ข้อมูลจำลอง — ไม่ต่อ WordPress ทั้งหมดอยู่ในหน้านี้
   ============================================================ */

const LABELS = {
  breaking: { text: 'BREAKING', bg: '#e62227', fg: '#ffffff' },
  update:   { text: 'UPDATE',   bg: '#1a1a1a', fg: '#ffffff' },

  watch:    { text: 'WATCH',    bg: '#f1e9fd', fg: '#5b21b6' },
  photo:    { text: 'PHOTO',    bg: '#e6f7ee', fg: '#065f46' },

const COVER = (window.ARTICLES && window.ARTICLES[0] && window.ARTICLES[0].image) || 'assets/event-isaan-2026.png';

  summaryLine: 'ยกระดับเตือนภัยเป็นระดับ 3 ใน 4 อำเภอ เปิดศูนย์พักพิง 12 แห่ง',
  highlights: [

const SEED_ENTRIES = [

    body: 'กรมป้องกันและบรรเทาสาธารณภัยประกาศยกระดับการเตือนภัยในพื้นที่ 4 อำเภอ ขอให้ประชาชนเตรียมพร้อมอพยพและติดตามประกาศจากทางราชการอย่างใกล้ชิด' },

/* ข้อความสำหรับปุ่ม "โพสต์อัปเดตใหม่" ในแผง demo */
const NEXT_UPDATES = [
  { label: 'breaking', title: 'สั่งอพยพเพิ่ม 2 ตำบล',
    body: 'ผู้ว่าราชการจังหวัดสั่งอพยพประชาชนในพื้นที่ 2 ตำบลเพิ่มเติม หลังระดับน้ำเพิ่มขึ้นต่อเนื่อง' },

  { label: 'quote', title: '“เราเตรียมพร้อมมาแล้ว 3 วัน”',
    body: 'ผู้อำนวยการศูนย์บรรเทาสาธารณภัยระบุว่าทีมกู้ภัยประจำจุดครบทุกอำเภอตั้งแต่ก่อนฝนตกหนัก' },
];

/* ============================================================
   ยูทิลิตี
   ============================================================ */

function relTime(mins) {
  if (mins < 1) return 'เมื่อสักครู่';
  if (mins < 60) return mins + ' นาทีที่แล้ว';
  const h = Math.floor(mins / 60);
  if (h < 24) return h + ' ชั่วโมงที่แล้ว';
  return Math.floor(h / 24) + ' วันที่แล้ว';
}

function absTime(mins) {
  const d = new Date(Date.now() - mins * 60000);
  return String(d.getHours()).padStart(2, '0') + '.' + String(d.getMinutes()).padStart(2, '0') + ' น.';
}

function Chip({ label }) {
  const l = LABELS[label];
  if (!l) return null;
  return <span className="bnl-chip" style={{ background: l.bg, color: l.fg }}>{l.text}</span>;
}

/* ============================================================
   แถบข่าวด่วน — สลับสไลด์ + เลื่อนข้อความยาว
   ============================================================ */

function Ticker({ slides, onOpenPhoto }) {
  const [i, setI] = React.useState(0);
  const [fading, setFading] = React.useState(false);
  const [closed, setClosed] = React.useState(false);
  const linkRef = React.useRef(null);
  const textRef = React.useRef(null);
  const trackRef = React.useRef(null);
  const [marquee, setMarquee] = React.useState(null);

  const slide = slides[Math.min(i, slides.length - 1)];

  // วัดว่าข้อความยาวเกินกรอบไหม ถ้าเกินให้เลื่อนวนต่อเนื่อง
  React.useLayoutEffect(() => {
    setMarquee(null);
    if (!linkRef.current || !textRef.current) return;
    const avail = linkRef.current.clientWidth;
    const w = textRef.current.scrollWidth;
    if (!avail || w - avail <= 4) return;
    const GAP = 64, SPEED = 55;          // px/วินาที — ช้าพอให้อ่านทัน
    const shift = w + GAP;
    setMarquee({ shift, dur: (shift / SPEED).toFixed(1) });
  }, [slide, slides.length]);

  // หมุนสไลด์ — ถ้าข้อความกำลังเลื่อน ให้รอจนครบรอบ (จำกัดไม่เกิน 30 วิ)
  React.useEffect(() => {
    if (slides.length < 2 || closed) return;
    const loopMs = marquee ? Math.min(Math.max(marquee.dur * 1000 + 700, 9000), 30000) : 6500;
    const t = setTimeout(() => {
      setFading(true);
      setTimeout(() => { setI(v => (v + 1) % slides.length); setFading(false); }, 260);
    }, loopMs);
    return () => clearTimeout(t);
  }, [i, slides.length, marquee, closed]);

  if (closed || !slide) return null;

  return (
    <div
      className={'bnl-ticker' + (fading ? ' bnl-fading' : '') + (marquee ? ' bnl-marquee' : '')}
      style={marquee ? { '--bnl-shift': marquee.shift + 'px', '--bnl-dur': marquee.dur + 's' } : undefined}
      role="complementary" aria-label="ข่าวด่วน"
    >
      <span className={'bnl-badge' + (slide.type === 'alert' ? ' bnl-badge--alert' : '')}>{slide.badge}</span>
      <a className="bnl-ticker__link" ref={linkRef} href={slide.url || '#'}
         onClick={e => { if (!slide.url) e.preventDefault(); }}
         {...(slide.url ? { target: '_blank', rel: 'noopener noreferrer' } : {})}>
        <span className="bnl-track" ref={trackRef}>
          <span className="bnl-text" ref={textRef}>{slide.text}</span>
          <span className="bnl-text bnl-clone" aria-hidden="true">{slide.text}</span>
        </span>
      </a>
      {slide.image && (
        <button type="button" className="bnl-photo" onClick={() => onOpenPhoto(slide.image, slide.text)}>
          <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
            <path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8.5 11 11 14l2.5-3 4.5 6H5l3.5-6z"/>
          </svg>
          <span>ดูรูป</span>
        </button>
      )}
      <button type="button" className="bnl-close" aria-label="ปิด" onClick={() => setClosed(true)}>×</button>
    </div>
  );
}

/* ============================================================
   กล่องอัปเดตล่าสุด 2 ช่อง (แบบที่ขึ้นบนหน้าแรก)
   ============================================================ */

function LiveBox({ story, entries, tick }) {
  const latest = entries[0];
  return (
    <div className="bnl-box">
      <div className="bnl-feature">
        <div className="bnl-feature__media">
          <img className="bnl-feature__img" src={story.cover} alt="" />
          <span className="bnl-live-tag"><span className="bnl-dot" aria-hidden="true" />LIVE</span>
        </div>
        <div className="bnl-feature__body">
          <span className="bnl-updated">อัปเดต {latest ? relTime(latest.mins) : 'เมื่อสักครู่'}</span>
          <h3 className="bnl-feature__title">{story.headline}</h3>
          <p className="bnl-feature__excerpt">{story.summaryLine}</p>
        </div>
      </div>
      <div className="bnl-updates">
        <div className="bnl-updates__head">
          <span className="bnl-updates__title">Live Updates</span>
          <span className="bnl-auto">อัปเดตอัตโนมัติ</span>
        </div>
        <div className="bnl-list">
          {entries.slice(0, 5).map((e, idx) => (
            <a className={'bnl-row' + (idx === 0 ? ' bnl-row--latest' : '') + (e.isNew ? ' bnl-row--new' : '')}
               key={e.id} href="#feed" onClick={ev => ev.preventDefault()}>
              <span className="bnl-row__dot" aria-hidden="true" />
              <span className="bnl-row__main">
                <span className="bnl-row__meta">
                  <span className="bnl-row__time">{relTime(e.mins)}</span>
                  <Chip label={e.label} />
                </span>
                <span className="bnl-row__text">{e.title || e.body}</span>
              </span>
            </a>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   หน้าข่าวสด — LIVE bar + HIGHLIGHTS + ไทม์ไลน์
   ============================================================ */

function LiveArticle({ story, entries, isLive, onOpenPhoto }) {
  return (
    <div>
      <div className="bnl-livebar">
        <span className="bnl-badge">BREAKING</span>
        <span className="bnl-livebar__text">
          {isLive ? 'ข่าวด่วน — กำลังอัปเดตต่อเนื่อง' : 'จบการรายงานสดแล้ว'}
        </span>
        {isLive && <span className="bnl-livebar__live"><span className="bnl-dot" aria-hidden="true" />LIVE</span>}
      </div>

      <div className="bnl-highlights">
        <div className="bnl-highlights__title">HIGHLIGHTS</div>
        <ul>{story.highlights.map((h, i) => <li key={i}>{h}</li>)}</ul>
      </div>

      <div className="bnl-count" id="feed">
        <strong>{entries.length} อัปเดต</strong>
        <span>ซิงก์ล่าสุด {absTime(0)}</span>
      </div>

      <div className="bnl-feed">
        {entries.map((e, idx) => (
          <div className={'bnl-item' + (idx === 0 ? ' bnl-item--first' : '') + (e.isNew ? ' bnl-row--new' : '')} key={e.id}>
            <div className="bnl-item__time">
              <span className="bnl-item__rel">{relTime(e.mins)}</span>
              <span className="bnl-item__abs">({absTime(e.mins)})</span>
            </div>
            <div className="bnl-card">
              <Chip label={e.label} />
              {e.title && <h3 className="bnl-card__title">{e.title}</h3>}
              {e.image && (
                <img className="bnl-card__img" src={e.image} alt=""
                     style={{ cursor: 'zoom-in' }}
                     onClick={() => onOpenPhoto(e.image, e.title || e.body)} />
              )}
              <div className="bnl-card__body"><p>{e.body}</p></div>
              <div className="bnl-card__foot">
                <button type="button" className="bnl-share">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
                    <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
                  </svg>
                  แชร์
                </button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   popup ดูรูป
   ============================================================ */

function Lightbox({ shot, onClose }) {
  React.useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', onKey);
    document.documentElement.style.overflow = shot ? 'hidden' : '';
    return () => { document.removeEventListener('keydown', onKey); document.documentElement.style.overflow = ''; };
  }, [shot, onClose]);

  if (!shot) return null;
  return (
    <div className="bnl-lightbox is-open" role="dialog" aria-modal="true"
         onClick={e => { if (e.target === e.currentTarget) onClose(); }}>
      <button type="button" className="bnl-lightbox__close" aria-label="ปิด" onClick={onClose}>×</button>
      <div>
        <img className="bnl-lightbox__img" src={shot.src} alt="" />
        <p className="bnl-lightbox__cap">{shot.caption}</p>
      </div>
    </div>
  );
}

/* ============================================================
   หน้า demo
   ============================================================ */

function App() {
  const [dark, setDark] = React.useState(false);
  const [activeCat, setActiveCat] = React.useState('ALL');

  const [entries, setEntries] = React.useState(SEED_ENTRIES);
  const [alerts, setAlerts] = React.useState(SEED_ALERTS);
  const [isLive, setIsLive] = React.useState(true);
  const [shot, setShot] = React.useState(null);
  const [tick, setTick] = React.useState(0);
  const nextIdx = React.useRef(0);

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  }, [dark]);

  // เดินเวลาเหมือนของจริง เพื่อให้ "x นาทีที่แล้ว" ขยับเอง
  React.useEffect(() => {
    const iv = setInterval(() => {
      setEntries(list => list.map(e => ({ ...e, mins: e.mins + 1, isNew: false })));
      setTick(t => t + 1);
    }, 60000);
    return () => clearInterval(iv);
  }, []);

  const slides = React.useMemo(() => {
    const out = [];
    if (isLive) out.push({ type: 'breaking', badge: 'BREAKING', text: STORY.headline });
    alerts.forEach(a => out.push({ type: 'alert', badge: 'ข่าวด่วน', text: a.text, image: a.image }));
    return out;
  }, [isLive, alerts]);

  const postUpdate = () => {
    const src = NEXT_UPDATES[nextIdx.current % NEXT_UPDATES.length];
    nextIdx.current += 1;
    setEntries(list => [{ ...src, id: 'n' + Date.now(), mins: 0, isNew: true }, ...list]);
  };

  const addAlert = () => {
    setAlerts(list => list.length
      ? []
      : [{ id: 'a' + Date.now(), text: 'ประกาศด่วน: เปิดจุดแจกน้ำดื่มและถุงยังชีพ 6 จุดในเขตเทศบาล', image: COVER }]);
  };

  return (
    <div>
      {/* แผงควบคุมสำหรับกดโชว์ — ไม่มีในระบบจริง */}
      <div className="bnl-demo">
        <div className="bnl-demo__in">
          <span className="bnl-demo__tag">DEMO</span>
          <span className="bnl-demo__hint">กดปุ่มเพื่อดูระบบตอบสนอง — ข้อมูลจำลอง ไม่ต่อ WordPress</span>
          <button className="bnl-btn" onClick={postUpdate}>+ โพสต์อัปเดตใหม่</button>
          <button className={'bnl-btn' + (alerts.length ? ' bnl-btn--on' : '')} onClick={addAlert}>
            {alerts.length ? 'ลบประกาศด่วน' : '+ ประกาศด่วน'}
          </button>
          <button className={'bnl-btn' + (isLive ? ' bnl-btn--on' : '')} onClick={() => setIsLive(v => !v)}>
            {isLive ? 'จบข่าว (ปิด LIVE)' : 'เปิด LIVE'}
          </button>
        </div>
      </div>

      <Header dark={dark} setDark={setDark} activeCat={activeCat} setActiveCat={setActiveCat} variant="minimal" />

      <main>
        <div className="bnl-wrap">
          <div className="bnl-section-label">1 — แถบข่าวด่วน (แสดงทุกหน้าของเว็บ ใต้เมนู)</div>
          {slides.length > 0
            ? <Ticker slides={slides} onOpenPhoto={(src, caption) => setShot({ src, caption })} />
            : <div className="bnl-note">ไม่มีข่าวด่วนที่กำลัง LIVE — แถบจะไม่แสดงเลย ไม่เหลือกล่องว่าง</div>}

          <div className="bnl-section-label">2 — กล่องอัปเดตล่าสุดบนหน้าแรก</div>
          {isLive
            ? <LiveBox story={STORY} entries={entries} tick={tick} />
            : <div className="bnl-note">จบข่าวแล้ว กล่องนี้จะหายไปเองโดยไม่ต้องแก้อะไร</div>}

          <div className="bnl-section-label">3 — หน้าข่าวสด: ไทม์ไลน์รายงานสด</div>
          <LiveArticle story={STORY} entries={entries} isLive={isLive}
                       onOpenPhoto={(src, caption) => setShot({ src, caption })} />

          <div className="bnl-note" style={{ marginTop: 34 }}>
            <strong>หมายเหตุ</strong> — หน้านี้เป็นตัวอย่างการแสดงผลเท่านั้น ข้อมูลทั้งหมดอยู่ในหน้าเว็บนี้
            ระบบจริงเป็นปลั๊กอิน WordPress ที่นักข่าวโพสต์อัปเดตผ่านหน้าเฉพาะโดยไม่ต้องเข้า wp-admin
            และเมื่อจบข่าวจะเก็บไทม์ไลน์ทั้งหมดเป็นเนื้อหาถาวรในบทความพร้อมสารบัญตามวันที่
          </div>
        </div>
      </main>

      <Footer />
      <Lightbox shot={shot} onClose={() => setShot(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
